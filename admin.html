<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>لوحة التحكم</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
</head>
<body>
    <div id="loader"><div class="spinner"></div></div>

    <!-- Login Section -->
    <div id="login-section" style="display: none;">
        <div class="modal-content" style="text-align: center;">
            <h2 style="margin-bottom: 1.5rem;">🔐 تسجيل دخول المسؤول</h2>
            <form id="login-form">
                <div class="form-group">
                    <input type="email" id="username" class="form-control" placeholder="البريد الإلكتروني" required>
                </div>
                <div class="form-group">
                    <input type="password" id="password" class="form-control" placeholder="كلمة المرور" required>
                </div>
                <button type="submit" class="btn-primary">دخول</button>
            </form>
        </div>
    </div>

    <!-- Admin Content -->
    <div id="admin-content" style="display: none;">
        <header>
            <a href="admin.html" class="logo">⚙️ لوحة التحكم</a>
            <nav class="nav-links">
                <a href="index.html" target="_blank" class="btn-nav">🛍️ المتجر</a>
                <button id="logout-btn" class="btn-nav" style="background: var(--danger);">خروج</button>
            </nav>
        </header>

        <div class="container">
            <!-- Stats -->
            <div class="stats-grid">
                <div class="stat-card">
                    <div class="stat-label">إجمالي المبيعات</div>
                    <div class="stat-value" id="stat-sales">0 دج</div>
                </div>
                <div class="stat-card">
                    <div class="stat-label">عدد الطلبات</div>
                    <div class="stat-value" id="stat-orders">0</div>
                </div>
                <div class="stat-card">
                    <div class="stat-label">قيد الانتظار</div>
                    <div class="stat-value" id="stat-pending" style="color: var(--accent);">0</div>
                </div>
                <div class="stat-card">
                    <div class="stat-label">تم التوصيل</div>
                    <div class="stat-value" id="stat-delivered" style="color: var(--success);">0</div>
                </div>
            </div>

            <!-- Chart -->
            <div class="chart-container">
                <h3>📊 تحليلات المبيعات</h3>
                <canvas id="salesChart" height="100"></canvas>
            </div>

            <div class="admin-panel">
                <!-- Add Product -->
                <div class="panel-card">
                    <h3 id="product-form-title">➕ إضافة منتج جديد</h3>
                    <form id="add-product-form" style="margin-top: 1rem;">
                        <input type="hidden" id="edit-product-id">
                        <div class="form-group">
                            <label>اسم المنتج *</label>
                            <input type="text" id="prod-name" class="form-control" required>
                        </div>
                        <div class="form-group">
                            <label>السعر (دج) *</label>
                            <input type="number" id="prod-price" class="form-control" required>
                        </div>
                        <div class="form-group">
                            <label>الوصف</label>
                            <textarea id="prod-desc" class="form-control" rows="3"></textarea>
                        </div>
                        <div class="form-group">
                            <label>صور المنتج (روابط)</label>
                            <div id="images-container"></div>
                            <button type="button" class="btn-nav" style="width: 100%; margin-top: 10px; background: var(--secondary);" onclick="addImageField()">+ إضافة صورة</button>
                        </div>
                        <button type="submit" class="btn-primary">حفظ المنتج</button>
                    </form>
                </div>

                <!-- Orders Table -->
                <div class="panel-card">
                    <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 1rem;">
                        <h3>📥 الطلبات الواردة</h3>
                        <button id="export-btn" class="btn-nav" style="background: var(--success);">📥 تصدير CSV</button>
                    </div>
                    <div class="table-responsive">
                        <table>
                            <thead>
                                <tr>
                                    <th>المنتج</th>
                                    <th>الزبون</th>
                                    <th>الولاية</th>
                                    <th>الإجمالي</th>
                                    <th>الحالة</th>
                                    <th>إجراءات</th>
                                </tr>
                            </thead>
                            <tbody id="orders-table-body">
                                <!-- Orders -->
                            </tbody>
                        </table>
                    </div>
                </div>
            </div>
            
            <!-- Products List -->
            <div class="panel-card" style="margin-top: 2rem;">
                <h3>📦 المنتجات الحالية</h3>
                <div id="admin-products-list" style="margin-top: 1rem;"></div>
            </div>
        </div>
    </div>

    <!-- Edit Order Modal -->
    <div id="order-edit-modal" class="modal">
        <div class="modal-content">
            <button class="close-modal" onclick="closeEditModal()">✕</button>
            <h3>✏️ تعديل تفاصيل الطلب</h3>
            <form id="edit-order-form" style="margin-top: 1rem;">
                <input type="hidden" id="edit-order-id">
                <div class="form-group">
                    <label>حالة الطلب</label>
                    <select id="edit-status" class="form-control">
                        <option value="جديد">جديد</option>
                        <option value="مؤكد">مؤكد</option>
                        <option value="في التوصيل">في التوصيل</option>
                        <option value="تم التوصيل">تم التوصيل</option>
                        <option value="ملغي">ملغي</option>
                    </select>
                </div>
                <div class="form-group">
                    <label>الاسم</label>
                    <input type="text" id="edit-fname" class="form-control">
                </div>
                <div class="form-group">
                    <label>اللقب</label>
                    <input type="text" id="edit-lname" class="form-control">
                </div>
                <div class="form-group">
                    <label>الهاتف</label>
                    <input type="text" id="edit-phone" class="form-control">
                </div>
                <div class="form-group">
                    <label>الولاية</label>
                    <input type="text" id="edit-wilaya" class="form-control">
                </div>
                <div class="form-group">
                    <label>العنوان</label>
                    <input type="text" id="edit-address" class="form-control">
                </div>
                <button type="submit" class="btn-primary">حفظ التعديلات</button>
                <button type="button" onclick="printOrder()" class="btn-nav" style="width: 100%; margin-top: 10px; background: var(--text);">🖨️ طباعة</button>
            </form>
        </div>
    </div>

    <script type="module" src="script.js"></script>
</body>
</html>
